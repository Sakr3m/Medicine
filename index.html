<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Promemoria</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg: #12181A;
    --card: #1B2224;
    --ink: #F5F7F6;
    --ink-soft: #8A9895;
    --line: #2B3436;
    --done: #6E9C8C;
    --done-bg: #1E2B26;
    --pending: #F5F7F6;
    --accent: #D9705A;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .page{
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    overflow-y: auto;
    padding: env(safe-area-inset-top,0) 18px 40px 18px;
  }

  .day-header{
    display:flex;
    align-items:flex-start;
    gap: 8px;
    padding: 24px 0 18px 0;
  }
  .header-center{ flex:1; text-align:center; min-width:0; }

  .nav-btn{
    flex-shrink:0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-top: 4px;
  }
  .nav-btn svg{ width:18px; height:18px; }
  .nav-btn:disabled{ opacity: .25; pointer-events:none; }

  .badge-today{
    display:inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    background: var(--accent);
    color: #12181A;
    border-radius: 20px;
    padding: 3px 10px;
  }
  .today-slot{
    text-align:center;
    min-height: 0;
  }
  .today-slot:empty{ display:none; }
  .today-slot .badge-today{ margin-top: 22px; }
  .eyebrow{
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  h1{
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-transform: capitalize;
    color: var(--ink);
  }
  .progress{
    margin-top: 14px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .progress-track{
    flex:1;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--done);
    border-radius: 3px;
    transition: width .35s ease;
    width:0%;
  }
  .progress-label{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 40px;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .section{ margin-top: 26px; }
  .section-title{
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding-left: 2px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .item{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    transition: background .2s ease;
  }
  .item:last-child{ border-bottom: none; }
  .item.done{ background: var(--done-bg); }
  .dot{
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink:0;
  }
  .item.done .dot{ background: var(--done); }
  .item-body{ flex:1; min-width:0; }
  .item-name{
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    color: var(--pending);
  }
  .item.done .item-name{
    color: var(--done);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .item-tag{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .btn{
    flex-shrink:0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .btn svg{ width:16px; height:16px; opacity:0; transition: opacity .15s ease; }
  .item.done .btn{ background: var(--done); border-color: var(--done); }
  .item.done .btn svg{ opacity:1; stroke: #12181A; }
  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0 10px 0;
  }
  .confirm-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .confirm-overlay.open{ display:flex; }
  .confirm-box{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    max-width: 340px;
    width: 100%;
  }
  .confirm-text{
    margin: 0 0 18px 0;
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
  }
  .confirm-actions{
    display:flex;
    gap: 10px;
  }
  .confirm-btn{
    flex:1;
    padding: 11px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .confirm-btn.cancel{
    background: transparent;
    color: var(--ink-soft);
  }
  .confirm-btn.ok{
    background: var(--accent);
    color: #12181A;
    border-color: var(--accent);
  }
</style>
</head>
<body>

<div class="page">
  <div class="day-header">
    <button class="nav-btn" id="prevBtn" aria-label="Giorno precedente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="header-center" id="headerCenter"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Giorno successivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
  <div class="today-slot" id="todaySlot"></div>
  <main id="mainContent"></main>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p class="confirm-text" id="confirmText"></p>
    <div class="confirm-actions">
      <button class="confirm-btn cancel" id="confirmCancel">Annulla</button>
      <button class="confirm-btn ok" id="confirmOk">Togli spunta</button>
    </div>
  </div>
</div>

<script>
// ---- Definizione farmaci ricorrenti ----
const ANTIBIOTIC_START = "2026-08-02"; // giorno 1 di Cefixoral
const ANTIBIOTIC_DAYS = 4;
const RANGE = 30; // giorni prima/dopo oggi

const ANTIBIOTIC_ITEM = { id: "cefixoral", name: "Cefixoral", tag: "Antibiotico" };

const SCHEDULE = {
  "Mattina": [
    { id: "tareg", name: "Tareg Valsartan", tag: "Pressione" },
    { id: "forxiga", name: "Forxiga", tag: "Diuretico" },
    { id: "lasix", name: "Lasix", tag: "Diuretico" },
  ],
  "Pranzo": [
    { id: "spirofur", name: "Spirofur", tag: "Diuretico" },
    { id: "cardioaspirina", name: "Cardioaspirina", tag: "Cuore" },
  ],
  "Sera": [
    { id: "rosuvastatina", name: "Rosuvastatina", tag: "Statina" },
    { id: "cardicor", name: "Cardicor Bisoprololo", tag: "Cuore" },
  ]
};

// ---- Utility date ----
function dateKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function daysBetween(a, b){
  const x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((x - y) / 86400000);
}
function formatDate(d){
  return d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const ANTIBIOTIC_START_DATE = new Date(ANTIBIOTIC_START + "T00:00:00");

// ---- Storage ----
function loadState(key){
  try{
    const raw = localStorage.getItem("promemoria:" + key);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(key, state){
  try{ localStorage.setItem("promemoria:" + key, JSON.stringify(state)); }
  catch(e){ console.error("Storage error", e); }
}

// ---- Popup conferma deselezione ----
const confirmOverlay = document.getElementById("confirmOverlay");
const confirmText = document.getElementById("confirmText");
const confirmCancel = document.getElementById("confirmCancel");
const confirmOk = document.getElementById("confirmOk");
let pendingConfirm = null;

function askConfirm(itemName, onConfirm){
  confirmText.textContent = `Vuoi togliere la spunta a "${itemName}"?`;
  pendingConfirm = onConfirm;
  confirmOverlay.classList.add("open");
}
function closeConfirm(){
  confirmOverlay.classList.remove("open");
  pendingConfirm = null;
}
confirmCancel.addEventListener("click", closeConfirm);
confirmOverlay.addEventListener("click", (e) => { if(e.target === confirmOverlay) closeConfirm(); });
confirmOk.addEventListener("click", () => {
  if(pendingConfirm) pendingConfirm();
  closeConfirm();
});

// ---- Navigazione giorno ----
const headerCenter = document.getElementById("headerCenter");
const mainContent = document.getElementById("mainContent");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let offset = 0;

function render(){
  const date = addDays(TODAY, offset);
  const key = dateKey(date);
  const isToday = offset === 0;
  let state = loadState(key);

  const cycleDay = daysBetween(date, ANTIBIOTIC_START_DATE);
  const antibioticActive = cycleDay >= 0 && cycleDay < ANTIBIOTIC_DAYS;

  prevBtn.disabled = offset <= -RANGE;
  nextBtn.disabled = offset >= RANGE;

  headerCenter.innerHTML = `
    <p class="eyebrow">Promemoria del giorno</p>
    <h1>${formatDate(date)}</h1>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
      <div class="progress-label" id="label">0/0</div>
    </div>
  `;

  document.getElementById("todaySlot").innerHTML = isToday ? '<div class="badge-today">Oggi</div>' : '';

  mainContent.innerHTML = "";
  let done = 0, total = 0;

  function buildRow(item){
    total++;
    const isDone = !!state[item.id];
    if(isDone) done++;
    const row = document.createElement("div");
    row.className = "item" + (isDone ? " done" : "");
    row.innerHTML = `
      <div class="dot"></div>
      <div class="item-body">
        <p class="item-name">${item.name}</p>
        <div class="item-tag">${item.tag}</div>
      </div>
      <button class="btn" aria-label="Segna come fatto">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    `;
    row.addEventListener("click", () => {
      const currentlyDone = !!state[item.id];
      if(currentlyDone){
        askConfirm(item.name, () => {
          state[item.id] = false;
          saveState(key, state);
          render();
        });
      } else {
        state[item.id] = true;
        saveState(key, state);
        render();
      }
    });
    return row;
  }

  if(antibioticActive){
    const abSection = document.createElement("div");
    abSection.className = "section";
    abSection.innerHTML = `<div class="section-title">Antibiotico · giorno ${cycleDay+1} di ${ANTIBIOTIC_DAYS}</div>`;
    const abCard = document.createElement("div");
    abCard.className = "card";
    abCard.appendChild(buildRow(ANTIBIOTIC_ITEM));
    abSection.appendChild(abCard);
    mainContent.appendChild(abSection);
  }

  for(const section in SCHEDULE){
    const items = SCHEDULE[section];
    const secDiv = document.createElement("div");
    secDiv.className = "section";
    secDiv.innerHTML = `<div class="section-title">${section}</div>`;
    const card = document.createElement("div");
    card.className = "card";
    for(const item of items){
      card.appendChild(buildRow(item));
    }
    secDiv.appendChild(card);
    mainContent.appendChild(secDiv);
  }

  if(total === 0){
    mainContent.innerHTML = '<div class="empty">Nessun farmaco previsto oggi.</div>';
  }

  document.getElementById("fill").style.width = total ? (done/total*100) + "%" : "0%";
  document.getElementById("label").textContent = done + "/" + total;
}

prevBtn.addEventListener("click", () => {
  if(offset > -RANGE){ offset--; render(); }
});
nextBtn.addEventListener("click", () => {
  if(offset < RANGE){ offset++; render(); }
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
