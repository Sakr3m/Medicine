<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Promemoria</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg: #12181A;
    --card: #1B2224;
    --ink: #F5F7F6;
    --ink-soft: #8A9895;
    --line: #2B3436;
    --done: #6E9C8C;
    --done-bg: #1E2B26;
    --pending: #F5F7F6;
    --accent: #D9705A;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .carousel{
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    height: 100dvh;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar{ display:none; }

  .day-slide{
    flex: 0 0 100%;
    scroll-snap-align: center;
    height: 100%;
    overflow-y: auto;
    padding: env(safe-area-inset-top,0) 18px 40px 18px;
  }
  .day-inner{ max-width: 480px; margin: 0 auto; }

  header{ padding: 28px 0 18px 0; }
  .badge-today{
    display:inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    background: var(--accent);
    color: #12181A;
    border-radius: 20px;
    padding: 3px 10px;
    margin-bottom: 8px;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  h1{
    font-size: 24px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-transform: capitalize;
    color: var(--ink);
  }
  .progress{
    margin-top: 14px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .progress-track{
    flex:1;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--done);
    border-radius: 3px;
    transition: width .35s ease;
    width:0%;
  }
  .progress-label{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 40px;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .section{ margin-top: 26px; }
  .section-title{
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding-left: 2px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .item{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    transition: background .2s ease;
  }
  .item:last-child{ border-bottom: none; }
  .item.done{ background: var(--done-bg); }
  .dot{
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink:0;
  }
  .item.done .dot{ background: var(--done); }
  .item-body{ flex:1; min-width:0; }
  .item-name{
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--pending);
  }
  .item.done .item-name{
    color: var(--done);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .item-tag{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .btn{
    flex-shrink:0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .btn svg{ width:16px; height:16px; opacity:0; transition: opacity .15s ease; }
  .item.done .btn{ background: var(--done); border-color: var(--done); }
  .item.done .btn svg{ opacity:1; stroke: #12181A; }
  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0 10px 0;
  }
  footer{ margin-top: 34px; text-align:center; }
  .reset{
    font-size: 12.5px;
    color: var(--ink-soft);
    background:none;
    border:none;
    text-decoration: underline;
    cursor:pointer;
    padding: 8px;
  }
</style>
</head>
<body>

<div class="carousel" id="carousel"></div>

<script>
// ---- Definizione farmaci ricorrenti ----
const ANTIBIOTIC_START = "2026-08-02"; // giorno 1 di Cefixoral
const ANTIBIOTIC_DAYS = 4;
const RANGE = 30; // giorni prima/dopo oggi

const SCHEDULE = {
  "Mattina": [
    { id: "cefixoral", name: "Cefixoral", tag: "Antibiotico", conditional: true },
    { id: "tareg", name: "Tareg Valsartan", tag: "Pressione" },
    { id: "forxiga", name: "Forxiga", tag: "Diuretico" },
    { id: "lasix", name: "Lasix", tag: "Diuretico" },
  ],
  "Pranzo": [
    { id: "spirofur", name: "Spirofur", tag: "Diuretico" },
    { id: "cardioaspirina", name: "Cardioaspirina", tag: "Cuore" },
  ],
  "Sera": [
    { id: "rosuvastatina", name: "Rosuvastatina", tag: "Statina" },
    { id: "cardicor", name: "Cardicor Bisoprololo", tag: "Cuore" },
  ]
};

// ---- Utility date ----
function dateKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function daysBetween(a, b){
  const x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((x - y) / 86400000);
}
function formatDate(d){
  return d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const ANTIBIOTIC_START_DATE = new Date(ANTIBIOTIC_START + "T00:00:00");

// ---- Storage ----
function loadState(key){
  try{
    const raw = localStorage.getItem("promemoria:" + key);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(key, state){
  try{ localStorage.setItem("promemoria:" + key, JSON.stringify(state)); }
  catch(e){ console.error("Storage error", e); }
}

function visibleItemsFor(date){
  const cycleDay = daysBetween(date, ANTIBIOTIC_START_DATE);
  const antibioticActive = cycleDay >= 0 && cycleDay < ANTIBIOTIC_DAYS;
  const bySection = {};
  for(const section in SCHEDULE){
    bySection[section] = SCHEDULE[section].filter(i => !i.conditional || antibioticActive);
  }
  return { bySection, antibioticActive, cycleDay };
}

function buildSlide(date){
  const key = dateKey(date);
  const isToday = key === dateKey(TODAY);
  let state = loadState(key);

  const slide = document.createElement("div");
  slide.className = "day-slide";
  slide.dataset.key = key;

  const inner = document.createElement("div");
  inner.className = "day-inner";
  slide.appendChild(inner);

  function render(){
    const { bySection, antibioticActive, cycleDay } = visibleItemsFor(date);
    let done = 0, total = 0;

    inner.innerHTML = "";

    const head = document.createElement("header");
    let badgeHtml = isToday ? '<div class="badge-today">Oggi</div>' : '';
    let eyebrowText = antibioticActive ? ("Cefixoral · giorno " + (cycleDay+1) + " di " + ANTIBIOTIC_DAYS) : "Promemoria del giorno";
    head.innerHTML = `
      ${badgeHtml}
      <p class="eyebrow">${eyebrowText}</p>
      <h1>${formatDate(date)}</h1>
      <div class="progress">
        <div class="progress-track"><div class="progress-fill" id="fill-${key}"></div></div>
        <div class="progress-label" id="label-${key}">0/0</div>
      </div>
    `;
    inner.appendChild(head);

    const main = document.createElement("main");
    for(const section in bySection){
      const items = bySection[section];
      if(items.length === 0) continue;

      const secDiv = document.createElement("div");
      secDiv.className = "section";
      secDiv.innerHTML = `<div class="section-title">${section}</div>`;
      const card = document.createElement("div");
      card.className = "card";

      for(const item of items){
        total++;
        const isDone = !!state[item.id];
        if(isDone) done++;
        const row = document.createElement("div");
        row.className = "item" + (isDone ? " done" : "");
        row.innerHTML = `
          <div class="dot"></div>
          <div class="item-body">
            <p class="item-name">${item.name}</p>
            <div class="item-tag">${item.tag}</div>
          </div>
          <button class="btn" aria-label="Segna come fatto">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        `;
        row.addEventListener("click", () => {
          state[item.id] = !state[item.id];
          saveState(key, state);
          render();
        });
        card.appendChild(row);
      }
      secDiv.appendChild(card);
      main.appendChild(secDiv);
    }
    if(total === 0){
      main.innerHTML = '<div class="empty">Nessun farmaco previsto oggi.</div>';
    }
    inner.appendChild(main);

    const foot = document.createElement("footer");
    const resetBtn = document.createElement("button");
    resetBtn.className = "reset";
    resetBtn.textContent = "Azzera questa giornata";
    resetBtn.addEventListener("click", () => {
      state = {};
      saveState(key, state);
      render();
    });
    foot.appendChild(resetBtn);
    inner.appendChild(foot);

    const fillEl = document.getElementById("fill-" + key);
    const labelEl = document.getElementById("label-" + key);
    if(fillEl) fillEl.style.width = total ? (done/total*100) + "%" : "0%";
    if(labelEl) labelEl.textContent = done + "/" + total;
  }

  render();
  return slide;
}

const carousel = document.getElementById("carousel");
let todaySlide = null;
for(let i = -RANGE; i <= RANGE; i++){
  const date = addDays(TODAY, i);
  const slide = buildSlide(date);
  if(i === 0) todaySlide = slide;
  carousel.appendChild(slide);
}
if(todaySlide){
  todaySlide.scrollIntoView({ behavior: "instant", inline: "center" });
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
